<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김성주, 생일 축하해! 🎂</title>
<meta name="description" content="김성주 만 22세 생일 파티 — 촛불을 끄고 소원을 빌어보세요">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: DSEG7;
    src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');
  }
  :root {
    --ui: Tahoma, Dotum, '돋움', Gulim, '굴림', 'Nanum Gothic', sans-serif;
    --title: 'Trebuchet MS', Tahoma, Dotum, '돋움', 'Nanum Gothic', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; font-family: var(--ui); font-size: 13px; color: #000; background: #3f7fe0; }
  [hidden] { display: none !important; }

  /* 배경: 하늘과 초록 언덕 */
  .wallpaper { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }

  .desk { display: flex; flex-direction: column; align-items: center; gap: 44px; padding: 32px 20px 100px; max-width: 1180px; margin: 0 auto; }
  .col { display: contents; }

  /* 창 */
  .window { position: relative; width: 100%; max-width: 350px; padding: 0 3px 3px; background: #0855dd; border-radius: 8px 8px 0 0; box-shadow: 0 10px 26px rgba(0, 0, 0, .38); }
  .titlebar {
    display: flex; align-items: center; gap: 2px; height: 31px; margin: 0 -3px; padding: 0 5px 0 9px; border-radius: 8px 8px 0 0;
    color: #fff; font: bold 14px var(--title); text-shadow: 1px 1px 1px #0f1089;
    background: linear-gradient(#0997ff, #0053ee 9%, #0050ee 40%, #0066ff 88%, #0066ff 93%, #005bff 95%, #003dd7);
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .titlebar b { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl {
    display: grid; place-items: center; width: 21px; height: 21px; border: 1px solid #fff; border-radius: 4px;
    font: bold 14px/1 var(--title); color: #fff; background: radial-gradient(circle at 30% 25%, #7aa7ff, #2a63e0 55%, #1941a5);
  }
  button.ctl { cursor: pointer; }
  button.close, #scareClose { background: radial-gradient(circle at 30% 25%, #f6b39b, #e0532c 55%, #a92a0c); }
  .ctl:hover { filter: brightness(1.15); }
  .body { padding: 14px; text-align: center; word-break: keep-all; background: #ece9d8; }
  .btn {
    min-width: 76px; font: 13px var(--ui); color: #000; padding: 6px 14px; cursor: pointer;
    background: linear-gradient(#fff, #f3f2ec 70%, #d8d3c6); border: 1px solid #003c74; border-radius: 4px;
  }
  .btn:hover { box-shadow: inset 0 0 0 2px #f8b636; }
  .btn:active { background: #dedbd0; box-shadow: inset 1px 1px 3px rgba(0, 0, 0, .25); }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .sunken { background: #fff; border: 1px solid #7f9db9; }

  /* 메인 창 */
  #party .body { padding-top: 18px; }
  .age { display: inline-block; padding: 4px 14px; background: #ffffe1; border: 1px solid #000; border-radius: 8px; box-shadow: 2px 2px 4px rgba(0, 0, 0, .25); font-weight: bold; }
  h1 { margin-top: 12px; font: 800 32px/1.35 var(--title); color: #003399; text-shadow: 1px 1px 0 #fff, 3px 3px 5px rgba(0, 51, 153, .25); }
  #message { margin-top: 10px; min-height: 3em; line-height: 1.5; font-size: 14px; }

  .cake { position: relative; width: 270px; height: 220px; margin: 4px auto 0; }
  .layer { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 18px 18px 10px 10px; box-shadow: inset -22px 0 26px rgba(0, 0, 0, .18), inset 18px 0 20px rgba(255, 255, 255, .25); }
  .layer::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 28px; border-radius: 18px 18px 0 0;
    background:
      radial-gradient(circle at 15px 18px, var(--icing) 14px, transparent 15px) 0 0 / 30px 34px repeat-x,
      linear-gradient(var(--icing) 18px, transparent 18px);
  }
  .bottom { bottom: 14px; width: 246px; height: 82px; background: #d9608f; --icing: #fff1f6; }
  .top { bottom: 94px; width: 176px; height: 64px; background: #f595ba; --icing: #fff6cc; }
  .plate { position: absolute; bottom: 0; left: 0; width: 100%; height: 18px; border-radius: 50%; background: linear-gradient(#fff, #aeb6c8); box-shadow: 0 3px 5px rgba(0, 0, 0, .25); }
  .candles { position: absolute; bottom: 156px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
  .candle { position: relative; width: 28px; height: 66px; border: 0; background: none; cursor: pointer; }
  .candle::after { content: ''; position: absolute; bottom: 0; left: 9px; width: 10px; height: 42px; border-radius: 3px; background: repeating-linear-gradient(45deg, #fff 0 5px, var(--c) 5px 10px); }
  .flame {
    position: absolute; bottom: 43px; left: 7px; width: 14px; height: 21px; border-radius: 50% / 65% 65% 35% 35%;
    background: radial-gradient(circle at 50% 70%, #fff7b0, #ffb02e 55%, #ff5a36); box-shadow: 0 0 14px 5px rgba(255, 170, 50, .6);
    transform-origin: bottom center; animation: flicker .35s ease-in-out infinite alternate;
  }
  @keyframes flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.1, .92) rotate(3deg); } }
  .candle.out .flame { opacity: 0; box-shadow: none; }

  /* 타이머, 지뢰찾기의 빨간 숫자 */
  .led { background: #000; color: #ff2b1c; font-family: DSEG7, monospace; font-weight: normal; text-shadow: 0 0 6px rgba(255, 43, 28, .7); }
  #countdown { display: block; margin-top: 10px; padding: 14px 4px; font-size: 34px; }

  /* 오류 창 */
  .alert { display: flex; align-items: center; gap: 12px; text-align: left; line-height: 1.6; }
  .alert canvas { width: 44px; height: 44px; flex: none; }

  /* 지뢰찾기 */
  #mineWin .body { background: #c0c0c0; }
  .mine-top { display: flex; align-items: center; justify-content: space-between; padding: 6px; margin-bottom: 10px; border: 2px solid; border-color: #808080 #fff #fff #808080; }
  .mine-top .led { padding: 5px 6px; font-size: 20px; }
  #face { min-width: 0; width: 38px; height: 38px; padding: 0; font-size: 20px; }
  .board { display: grid; grid-template-columns: repeat(8, 30px); justify-content: center; }
  .cell {
    width: 30px; height: 30px; font: bold 15px var(--ui); background: #c0c0c0; cursor: pointer;
    border: 3px solid; border-color: #fff #808080 #808080 #fff; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .cell:active { border-width: 1px; }
  .cell.open { border: 1px solid #909090; cursor: default; }
  .cell.boom { background: #ff2b1c; }
  #flagMode[aria-pressed="true"] { background: #c9ddff; box-shadow: inset 1px 1px 3px rgba(0, 0, 0, .35); }
  #mineText { margin-top: 8px; }

  /* 로딩 */
  .progress { display: flex; gap: 2px; height: 22px; margin: 12px 0; padding: 3px; border-radius: 5px; border-color: #686868; }
  .progress i { flex: 1; }
  .progress i.on { background: linear-gradient(#c8f5c9, #31d23a 45%, #28c231 65%, #9be89f); }

  /* 스티커 */
  .sticker {
    position: absolute; z-index: 2; width: var(--s, 64px); height: var(--s, 64px); cursor: grab; touch-action: none;
    filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, .35));
    animation: float 2.4s ease-in-out infinite alternate;
  }
  @keyframes float { to { transform: translateY(-8px); } }

  /* 설문 */
  #pollResult:not(:empty) { margin-top: 14px; font: 800 28px var(--title); color: #e0197d; }
  #scare { position: fixed; inset: 0; z-index: 3000; background: #000; }
  #chase { width: 100%; height: 100%; display: block; }
  #scareClose { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; font-size: 22px; }
  #scareEnd { position: absolute; inset: auto 0 12%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #scareEnd p { font: 800 32px var(--title); color: #ff2b1c; }
  #scareEnd .buttons { margin-top: 0; }

  /* 넓은 화면에서만 보이는 바닥 스티커 */
  .lawn { display: none; }
  @media (min-width: 1000px) and (min-height: 900px) { .lawn { display: block; } }
  .lawn .sticker { position: fixed; }

  /* 작업 표시줄 */
  .taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: stretch;
    height: calc(40px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: linear-gradient(#1f2f86, #3165c4 3%, #4490e6 9%, #2b71e0 15%, #235bd6 22%, #245ddb 55%, #2563e0 87%, #1d4fb8 95%, #1941a5);
  }
  #start {
    display: flex; align-items: center; gap: 7px; padding: 0 26px 0 12px; border: 0; border-radius: 0 16px 16px 0; cursor: pointer;
    color: #fff; font: italic bold 18px var(--title); text-shadow: 1px 1px 2px rgba(0, 0, 0, .6);
    background: linear-gradient(#37822f, #6fc065 8%, #429b3d 22%, #3a963a 70%, #4aad45 88%, #25611f);
    box-shadow: inset -6px 0 10px rgba(0, 0, 0, .25), 2px 0 4px rgba(0, 0, 0, .35);
  }
  #start:hover { filter: brightness(1.1); }
  #start canvas { width: 24px; height: 24px; }
  #clock {
    display: grid; place-items: center; padding: 0 16px; color: #fff; border-left: 1px solid #092e8c;
    background: linear-gradient(#0c59b9, #18b5f2 9%, #1290e8 20%, #0d8dea 63%, #1393ee 90%, #095bc9);
    box-shadow: inset 1px 0 1px #18bbff;
  }

  #confetti { position: fixed; inset: 0; z-index: 2000; pointer-events: none; }

  @media (min-width: 1000px) {
    .desk { flex-direction: row; align-items: flex-start; justify-content: center; gap: 44px; }
    .col { display: flex; flex: 1; flex-direction: column; align-items: center; gap: 48px; max-width: 350px; }
    .col:first-child { padding-top: 56px; }
    .col:last-child { padding-top: 20px; }
  }
  @media (max-width: 999px) {
    #party { order: 1; } #timerWin { order: 2; } #pollWin { order: 3; } #errorWin { order: 4; } #mineWin { order: 5; } #loadWin { order: 6; }
  }
  @media (prefers-reduced-motion: reduce) { .sticker, .flame { animation: none; } }
</style>
</head>
<body>
<svg class="wallpaper" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2463d6"/><stop offset=".75" stop-color="#b9dcff"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad12f"/><stop offset="1" stop-color="#2f6b0c"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#fff" opacity=".85" filter="url(#soft)">
    <ellipse cx="230" cy="150" rx="130" ry="34"/><ellipse cx="290" cy="122" rx="70" ry="40"/>
    <ellipse cx="640" cy="90" rx="110" ry="24"/><ellipse cx="920" cy="230" rx="160" ry="36"/><ellipse cx="870" cy="200" rx="70" ry="38"/>
    <ellipse cx="500" cy="380" rx="180" ry="26"/><ellipse cx="1110" cy="80" rx="90" ry="26"/>
  </g>
  <path d="M0 560 C220 450 420 470 640 540 C860 610 1020 520 1200 480 V800 H0Z" fill="url(#hill)"/>
  <path d="M0 660 C300 580 520 700 820 650 C1000 620 1100 640 1200 670 V800 H0Z" fill="#4c9414" opacity=".7"/>
</svg>

<main class="desk">
  <div class="col">
    <section class="window" id="timerWin">
      <div class="titlebar"><b>생일 타이머</b><span class="ctl" aria-hidden="true">_</span><span class="ctl" aria-hidden="true">□</span><button class="ctl close" aria-label="창 닫기">×</button></div>
      <div class="body" role="timer">
        <p id="timerLabel">생일 시작까지</p>
        <strong id="countdown" class="led sunken">--:--:--</strong>
      </div>
      <canvas class="sticker" data-emoji="💾" style="left:-18px; bottom:-34px"></canvas>
    </section>

    <section class="window" id="errorWin">
      <div class="titlebar"><b>Error</b><button class="ctl close" aria-label="창 닫기">×</button></div>
      <div class="body">
        <div class="alert"><canvas data-emoji="⚠️"></canvas><p id="errorText" aria-live="polite">나이 확인 오류:<br>만 22세 외의 숫자는<br>찾을 수 없습니다.</p></div>
        <div class="buttons"><button class="btn" id="agree">인정</button></div>
      </div>
      <canvas class="sticker" data-emoji="🐠" style="right:-16px; bottom:-38px; --s:76px"></canvas>
    </section>

    <section class="window" id="pollWin">
      <div class="titlebar"><b>설문조사.exe</b><button class="ctl close" aria-label="창 닫기">×</button></div>
      <div class="body">
        <p>Q. 만 22세 김성주는?</p>
        <div class="buttons">
          <button class="btn" id="old">늙었다</button>
          <button class="btn" id="young">젊다</button>
        </div>
        <p id="pollResult" aria-live="polite"></p>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="window" id="party">
      <div class="titlebar"><b>생일파티.exe</b><span class="ctl" aria-hidden="true">_</span><span class="ctl" aria-hidden="true">□</span><button class="ctl close" aria-label="창 닫기">×</button></div>
      <div class="body">
        <p class="age">만 22세</p>
        <h1>김성주<br>생일 축하해!</h1>
        <p id="message" aria-live="polite">소원을 빌고 촛불을 눌러서 꺼보세요 ✨</p>
        <div class="cake">
          <div class="plate"></div>
          <div class="layer bottom"></div>
          <div class="layer top"></div>
          <div class="candles" id="candles"></div>
        </div>
        <div class="buttons">
          <button class="btn" id="song">♪ 노래</button>
          <button class="btn" id="boom">폭죽</button>
          <button class="btn" id="relight">다시 불 켜기</button>
        </div>
      </div>
      <canvas class="sticker" data-emoji="💎" style="right:-18px; top:62px; --s:56px"></canvas>
      <canvas class="sticker" data-emoji="🌍" style="left:-20px; top:48px; --s:56px"></canvas>
      <canvas class="sticker" data-emoji="💿" style="right:-18px; bottom:-34px"></canvas>
    </section>
  </div>

  <div class="col">
    <section class="window" id="mineWin">
      <div class="titlebar"><b>지뢰찾기</b><span class="ctl" aria-hidden="true">_</span><span class="ctl" aria-hidden="true">□</span><button class="ctl close" aria-label="창 닫기">×</button></div>
      <div class="body">
        <div class="mine-top"><span class="led" id="mineCount">008</span><button class="btn" id="face" aria-label="새 게임">🙂</button><span class="led" id="mineTime">000</span></div>
        <div class="board" id="board"></div>
        <p id="mineText" aria-live="polite">지뢰를 피해서 선물을 지켜라!</p>
        <div class="buttons"><button class="btn" id="flagMode" aria-pressed="false">🚩 깃발 모드</button></div>
      </div>
      <canvas class="sticker" data-emoji="🖥️" style="left:-22px; bottom:-34px; --s:72px"></canvas>
    </section>

    <section class="window" id="loadWin">
      <div class="titlebar"><b>다운로드</b><button class="ctl close" aria-label="창 닫기">×</button></div>
      <div class="body">
        <p id="loadText">행복 다운로드 중... 0%</p>
        <div class="progress sunken" id="progress"></div>
        <button class="btn" id="reload">다시 받기</button>
      </div>
      <canvas class="sticker" data-emoji="🌳" style="right:-20px; bottom:-30px; --s:76px"></canvas>
      <canvas class="sticker" data-emoji="📼" style="left:-20px; bottom:-28px; --s:56px"></canvas>
    </section>
  </div>
</main>

<div class="lawn" aria-hidden="true">
  <canvas class="sticker" data-emoji="🗑️" style="left:5%; bottom:70px; --s:84px"></canvas>
  <canvas class="sticker" data-emoji="📁" style="left:17%; bottom:150px"></canvas>
  <canvas class="sticker" data-emoji="🎁" style="left:30%; bottom:64px; --s:92px"></canvas>
  <canvas class="sticker" data-emoji="🃏" style="right:30%; bottom:120px; --s:72px"></canvas>
  <canvas class="sticker" data-emoji="🏠" style="right:15%; bottom:68px; --s:88px"></canvas>
  <canvas class="sticker" data-emoji="🎈" style="right:4%; bottom:150px; --s:84px"></canvas>
</div>

<footer class="taskbar">
  <button id="start"><canvas data-emoji="🎂"></canvas>시작</button>
  <span id="clock"></span>
</footer>
<canvas id="confetti"></canvas>

<div id="scare" role="dialog" aria-modal="true" aria-label="칼을 든 케이크 귀신이 쫓아오는 영상" hidden>
  <canvas id="chase"></canvas>
  <button class="ctl" id="scareClose" aria-label="영상 닫기">×</button>
  <div id="scareEnd" hidden>
    <p>늙었다고...?</p>
    <div class="buttons"><button class="btn" id="replay">다시 보기</button><button class="btn" id="sorry">잘못했어요</button></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const colors = ['#ff4fa3', '#ffd400', '#00c96b', '#1ec8ff', '#9b5cff'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const message = $('message');
  const startText = message.textContent;

  // 타이머 (한국 시간): 11월 27일 0시에 생일 시작, 28일 0시에 끝
  const START = new Date('2026-11-27T00:00:00+09:00').getTime();
  const END = new Date('2026-11-28T00:00:00+09:00').getTime();
  const countdown = $('countdown');
  const timerLabel = $('timerLabel');
  let wasBefore = false;

  function tick(now = Date.now()) {
    $('clock').textContent = new Date(now).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    const before = now < START;
    // 페이지를 켜둔 채로 생일이 시작되면 폭죽
    if (wasBefore && !before && now < END) burst();
    wasBefore = before;

    const left = Math.max(0, Math.ceil(((before ? START : END) - now) / 1000));
    if (!left) {
      timerLabel.textContent = '2026년 생일은 여기까지!';
      countdown.textContent = '00:00:00';
      return;
    }
    timerLabel.textContent = before ? '생일 시작까지' : '🎉 생일 시작! 끝나기까지';
    const h = Math.floor(left / 3600);
    const m = Math.floor(left / 60) % 60;
    const s = left % 60;
    countdown.textContent = [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  }
  tick();
  setInterval(tick, 250);

  // 이모지 스티커 그리기
  function sticker(canvas) {
    const n = 128;
    canvas.width = canvas.height = n;
    const g = canvas.getContext('2d');
    g.font = '104px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(canvas.dataset.emoji, n / 2, n / 2 + 4);
  }
  document.querySelectorAll('canvas[data-emoji]').forEach(sticker);

  // 창과 스티커 끌어서 옮기기
  let top_ = 10;
  function draggable(handle, target) {
    let x = 0, y = 0, from;
    handle.addEventListener('pointerdown', e => {
      if (e.button || e.target.closest('button')) return;
      from = { x: e.clientX - x, y: e.clientY - y };
      target.style.zIndex = ++top_;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', e => {
      if (!from) return;
      x = e.clientX - from.x;
      y = e.clientY - from.y;
      target.style.translate = `${x}px ${y}px`;
    });
    const stop = () => { from = null; };
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
  }
  document.querySelectorAll('.window').forEach(w => {
    draggable(w.querySelector('.titlebar'), w);
    w.querySelector('.close').addEventListener('click', () => { w.hidden = true; });
  });
  document.querySelectorAll('.sticker').forEach(s => draggable(s, s));

  // 시작 버튼: 닫은 창 다시 열기
  $('start').addEventListener('click', e => {
    document.querySelectorAll('.window').forEach(w => { w.hidden = false; });
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.right, r.top, 80);
  });

  // 색종이
  const canvas = $('confetti');
  const ctx = canvas.getContext('2d');
  let pieces = [];
  let running = false;

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize);
  resize();

  function burst(x = innerWidth / 2, y = innerHeight / 3, count = 150) {
    if (reduced) return;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 9;
      pieces.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: Math.random() < .5 ? 6 : 10,
        color: colors[i % colors.length],
      });
    }
    if (!running) { running = true; requestAnimationFrame(draw); }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.vx *= .98;
      p.vy = p.vy * .98 + .22;
      p.x += p.vx;
      p.y += p.vy;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size * .6);
    }
    pieces = pieces.filter(p => p.y < canvas.height + 20);
    running = pieces.length > 0;
    if (running) requestAnimationFrame(draw);
  }

  // 촛불
  const box = $('candles');
  colors.forEach((color, i) => {
    const candle = document.createElement('button');
    candle.className = 'candle';
    candle.style.setProperty('--c', color);
    candle.setAttribute('aria-label', `${i + 1}번 촛불 끄기`);
    candle.innerHTML = '<span class="flame"></span>';
    candle.addEventListener('click', () => {
      if (candle.classList.contains('out')) return;
      candle.classList.add('out');
      const left = box.querySelectorAll('.candle:not(.out)').length;
      if (left) {
        message.textContent = `후~ 촛불이 ${left}개 남았어요`;
      } else {
        message.textContent = '소원이 꼭 이루어지길! 행복한 하루 보내 🥳';
        burst(innerWidth * .25, innerHeight * .35);
        burst(innerWidth * .75, innerHeight * .35);
        playSong();
      }
    });
    box.appendChild(candle);
  });

  $('relight').addEventListener('click', () => {
    box.querySelectorAll('.candle').forEach(c => c.classList.remove('out'));
    message.textContent = startText;
  });
  $('boom').addEventListener('click', () => burst());

  // 생일 축하 멜로디 (8비트 느낌)
  let audio;
  let playingUntil = 0;
  function playSong() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audio ??= new Ctx();
    audio.resume();
    if (audio.currentTime < playingUntil) return;
    const G = 392, A = 440, B = 493.9, C = 523.3, D = 587.3, E = 659.3, F = 698.5, G2 = 784;
    const notes = [
      [G,.75],[G,.25],[A,1],[G,1],[C,1],[B,2],
      [G,.75],[G,.25],[A,1],[G,1],[D,1],[C,2],
      [G,.75],[G,.25],[G2,1],[E,1],[C,1],[B,1],[A,2],
      [F,.75],[F,.25],[E,1],[C,1],[D,1],[C,2],
    ];
    const beat = .45;
    let t = audio.currentTime + .05;
    for (const [freq, length] of notes) {
      const dur = length * beat;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(.08, t + .02);
      gain.gain.exponentialRampToValueAtTime(.001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur);
      t += dur;
    }
    playingUntil = t;
  }
  $('song').addEventListener('click', playSong);

  // 오류 창
  $('agree').addEventListener('click', () => {
    $('errorText').innerHTML = '확인 완료.<br>당신은 만 22세입니다.<br>반박은 받지 않습니다.';
    burst(innerWidth / 2, innerHeight / 2, 60);
  });

  // 설문: '늙었다' → 칼 든 케이크 귀신이 쫓아오는 영상
  const scare = $('scare');
  const scareEnd = $('scareEnd');
  const pollResult = $('pollResult');
  const film = $('chase');
  const fx = film.getContext('2d');
  const LUNGE = 4.8, CUT = 5.8;
  let raf, startedAt, sound;

  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp = k => Math.min(1, Math.max(0, k));

  function oval(x, y, rx, ry, fill, rot = 0) {
    fx.beginPath();
    fx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    fx.fillStyle = fill;
    fx.fill();
  }

  function limb(points, width, color) {
    fx.beginPath();
    points.forEach(([x, y], i) => i ? fx.lineTo(x, y) : fx.moveTo(x, y));
    fx.lineWidth = width;
    fx.lineCap = fx.lineJoin = 'round';
    fx.strokeStyle = color;
    fx.stroke();
  }

  function shape(points, fill) {
    fx.beginPath();
    points.forEach(([x, y], i) => i ? fx.lineTo(x, y) : fx.moveTo(x, y));
    fx.closePath();
    fx.fillStyle = fill;
    fx.fill();
  }

  // 케이크 귀신: 몸 중심이 (0, 0), 폭이 약 230
  function cakeGhost(step) {
    const swing = Math.sin(step);
    // 가느다란 다리와 팔
    for (const side of [-1, 1]) {
      const lift = Math.max(0, side * swing) * 46;
      limb([[side * 52, 80], [side * 82, 140 - lift], [side * 58, 200 - lift]], 15, '#4a2419');
      oval(side * 70, 204 - lift, 30, 13, '#1b0c08');
    }
    limb([[104, 5], [158, 45 + swing * 30], [150, 105 + swing * 40]], 14, '#4a2419');
    // 초
    [-66, -22, 24, 70].forEach((x, i) => {
      const top = -150 - (i % 2) * 22;
      limb([[x, -84], [x + (i - 1.5) * 8, top]], 14, i % 2 ? '#6fd3c0' : '#d7d2e8');
      const fxPos = x + (i - 1.5) * 8 + Math.sin(step * 2 + i) * 5;
      oval(fxPos, top - 24, 13, 25, '#ff6a1f');
      oval(fxPos, top - 17, 6, 13, '#ffe66b');
    });
    // 빵
    const sponge = fx.createLinearGradient(-115, 0, 115, 0);
    sponge.addColorStop(0, '#59301c');
    sponge.addColorStop(.4, '#b9784a');
    sponge.addColorStop(1, '#46230f');
    shape([[-104, -72], [104, -72], [118, 94], [-118, 94]], sponge);
    limb([[-108, 40], [108, 40]], 13, '#7c1424');
    // 윗면과 흘러내리는 딸기 시럽
    oval(0, -74, 106, 25, '#c81f38');
    const drips = [34, 66, 24, 48, 20, 74, 30, 52];
    drips.forEach((len, i) => {
      const x = -91 + i * 26;
      limb([[x, -70], [x, -70 + len]], 22, '#a3122a');
    });
    // 짝짝이 눈
    for (const [x, y, r] of [[-46, -8, 30], [48, -16, 21]]) {
      oval(x, y, r, r, '#f4efd6');
      oval(x + swing * 4, y + 3, r * .22, r * .22, '#140000');
      limb([[x - r, y - r - 12 * Math.sign(-x)], [x + r, y - r + 12 * Math.sign(-x)]], 9, '#1b0c08');
    }
    // 톱니 입
    shape([[-84, 30], [-40, 46], [0, 36], [42, 48], [86, 24], [58, 80], [0, 94], [-55, 80]], '#170003');
    for (let i = 0; i < 7; i++) {
      const x = -66 + i * 20;
      shape([[x, 38], [x + 16, 42], [x + 8, 62]], '#efe6c4');
      shape([[x + 4, 84], [x + 20, 82], [x + 12, 64]], '#efe6c4');
    }
    // 케이크 칼을 든 팔
    const hx = -168, hy = 30 - Math.abs(swing) * 50;
    limb([[-106, 12], [-160, 66], [hx, hy]], 14, '#4a2419');
    fx.save();
    fx.translate(hx, hy);
    fx.rotate(-.35 + swing * .35);
    const steel = fx.createLinearGradient(-18, 0, 18, 0);
    steel.addColorStop(0, '#fff');
    steel.addColorStop(.5, '#aab8cc');
    steel.addColorStop(1, '#465166');
    shape([[-15, -14], [-19, -145], [0, -172], [17, -140], [15, -14]], steel);
    limb([[0, -12], [0, 30]], 22, '#17100c');
    oval(0, 6, 17, 15, '#4a2419');
    fx.restore();
  }

  function render(t) {
    const w = film.width, h = film.height, u = Math.min(w, h);
    fx.fillStyle = '#000';
    fx.fillRect(0, 0, w, h);
    if (t >= CUT) return;

    const run = clamp((t - .9) / (LUNGE - .9));
    const lunge = clamp((t - LUNGE) / .25);
    const shake = u * (.004 + run * .012 + lunge * .035);
    fx.save();
    fx.translate((Math.random() - .5) * shake, Math.sin(t * 13) * shake);

    // 어두운 복도: 문틀이 멀어짐 (뒷걸음질하는 카메라)
    const cx = w / 2, cy = h * .46;
    for (let i = 0; i < 7; i++) {
      const depth = (i + (t * 1.4) % 1) / 7;
      const size = Math.pow(1 - depth, 2);
      const rw = w * 1.3 * size + u * .08, rh = h * 1.3 * size + u * .1;
      fx.strokeStyle = `rgba(120, 70, 70, ${.1 + size * .3})`;
      fx.lineWidth = u * (.004 + size * .02);
      fx.strokeRect(cx - rw / 2, cy - rh / 2, rw, rh);
    }
    fx.strokeStyle = 'rgba(120, 70, 70, .25)';
    fx.lineWidth = u * .005;
    for (const [x, y] of [[0, 0], [w, 0], [0, h], [w, h]]) {
      fx.beginPath();
      fx.moveTo(x, y);
      fx.lineTo(cx, cy);
      fx.stroke();
    }

    // 케이크 귀신
    const step = t * (9 + run * 8);
    const near = u / 620;
    const scale = near * (lerp(.14, 1.25, run * run) + lunge * 2.1);
    const x = cx + Math.sin(step * .5) * u * .09 * (1 - lunge);
    const y = cy + lerp(0, h * .08, run) - Math.abs(Math.sin(step)) * u * .07 * run * (1 - lunge) + lunge * u * .03;
    fx.save();
    fx.translate(x, y);
    fx.rotate(Math.sin(step * .5) * .13 * (1 - lunge));
    fx.scale(scale, scale);
    cakeGhost(step);
    fx.restore();
    fx.restore();

    // 손전등, 노이즈, 주사선
    const light = fx.createRadialGradient(cx, cy, u * .12, cx, cy, u * .78);
    light.addColorStop(0, 'rgba(0, 0, 0, .05)');
    light.addColorStop(.6, 'rgba(0, 0, 0, .55)');
    light.addColorStop(1, 'rgba(0, 0, 0, .96)');
    fx.fillStyle = light;
    fx.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) {
      fx.fillStyle = `rgba(255, 255, 255, ${Math.random() * .14})`;
      fx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    fx.fillStyle = 'rgba(0, 0, 0, .22)';
    for (let line = 0; line < h; line += 4) fx.fillRect(0, line, w, 1);

    fx.font = `${Math.round(u * .045)}px Tahoma, monospace`;
    fx.fillStyle = '#fff';
    fx.fillText(`11.27  00:00:0${Math.floor(t)}`, u * .05, h - u * .05);
    fx.fillText('REC', u * .1, u * .085);
    if (t % 1 < .6) oval(u * .065, u * .07, u * .016, u * .016, '#ff2b1c');
  }

  // 발소리와 마지막 효과음
  function chaseSound() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audio ??= new Ctx();
    audio.resume();
    sound = audio.createGain();
    sound.connect(audio.destination);
    const now = audio.currentTime;
    const note = (type, from, to, at, dur, volume) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, now + at);
      osc.frequency.exponentialRampToValueAtTime(to, now + at + dur);
      gain.gain.setValueAtTime(volume, now + at);
      gain.gain.exponentialRampToValueAtTime(.001, now + at + dur);
      osc.connect(gain).connect(sound);
      osc.start(now + at);
      osc.stop(now + at + dur);
    };
    for (let at = .9, gap = .36; at < LUNGE; at += gap, gap = Math.max(.15, gap * .92)) {
      note('sine', 130, 45, at, .13, .1 + at * .05);
    }
    for (const f of [620, 660, 935]) note('sawtooth', f, f * 1.5, LUNGE, .9, .07);
  }

  function showEnd() {
    render(CUT);
    scareEnd.hidden = false;
    $('sorry').focus();
  }

  function play() {
    stopChase();
    scareEnd.hidden = true;
    const k = Math.min(1, 900 / Math.max(innerWidth, innerHeight));
    film.width = Math.round(innerWidth * k);
    film.height = Math.round(innerHeight * k);
    // 동작 줄이기 설정이면 정지 화면만 보여줌
    if (reduced) {
      render(3.8);
      scareEnd.hidden = false;
      $('sorry').focus();
      return;
    }
    $('scareClose').focus();
    chaseSound();
    startedAt = performance.now();
    const frame = now => {
      const t = Math.max(0, (now - startedAt) / 1000);
      if (t >= CUT) return showEnd();
      render(t);
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  function stopChase() {
    cancelAnimationFrame(raf);
    sound?.disconnect();
    sound = null;
  }

  $('old').addEventListener('click', () => {
    pollResult.textContent = '';
    pieces = [];
    scare.hidden = false;
    play();
  });
  function closeScare() {
    if (scare.hidden) return;
    stopChase();
    scare.hidden = true;
    $('young').focus();
  }
  $('sorry').addEventListener('click', closeScare);
  $('scareClose').addEventListener('click', closeScare);
  $('replay').addEventListener('click', play);
  addEventListener('keydown', e => { if (e.key === 'Escape') closeScare(); });
  $('young').addEventListener('click', e => {
    pollResult.textContent = '사랑해 💖';
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 120);
  });

  // 지뢰찾기 (8×8, 지뢰 8개)
  const SIZE = 8, MINES = 8;
  const board = $('board');
  const flagMode = $('flagMode');
  let cells, started, over, seconds, timer;

  const around = i => {
    const x = i % SIZE, y = Math.floor(i / SIZE), list = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const a = x + dx, b = y + dy;
        if ((dx || dy) && a >= 0 && a < SIZE && b >= 0 && b < SIZE) list.push(b * SIZE + a);
      }
    }
    return list;
  };
  const pad = n => String(n).padStart(3, '0');

  function newGame() {
    clearInterval(timer);
    started = over = false;
    seconds = 0;
    $('mineTime').textContent = pad(0);
    $('mineCount').textContent = pad(MINES);
    $('face').textContent = '🙂';
    $('mineText').textContent = '지뢰를 피해서 선물을 지켜라!';
    board.innerHTML = '';
    cells = Array.from({ length: SIZE * SIZE }, (_, i) => {
      const el = document.createElement('button');
      el.className = 'cell';
      el.setAttribute('aria-label', `${Math.floor(i / SIZE) + 1}행 ${i % SIZE + 1}열`);
      el.addEventListener('click', () => flagMode.getAttribute('aria-pressed') === 'true' ? flag(i) : open(i));
      el.addEventListener('contextmenu', e => { e.preventDefault(); flag(i); });
      board.appendChild(el);
      return { el, mine: false, open: false, flag: false };
    });
  }

  function flag(i) {
    const c = cells[i];
    if (over || c.open) return;
    c.flag = !c.flag;
    c.el.textContent = c.flag ? '🚩' : '';
    $('mineCount').textContent = pad(Math.max(0, MINES - cells.filter(c => c.flag).length));
  }

  // 첫 칸과 그 주변에는 지뢰를 두지 않음
  function plant(first) {
    const safe = new Set([first, ...around(first)]);
    let placed = 0;
    while (placed < MINES) {
      const i = Math.floor(Math.random() * cells.length);
      if (!safe.has(i) && !cells[i].mine) { cells[i].mine = true; placed++; }
    }
    started = true;
    timer = setInterval(() => { $('mineTime').textContent = pad(Math.min(999, ++seconds)); }, 1000);
  }

  function open(i) {
    if (over || cells[i].open || cells[i].flag) return;
    if (!started) plant(i);
    if (cells[i].mine) return finish(false, i);
    const stack = [i];
    while (stack.length) {
      const j = stack.pop(), c = cells[j];
      if (c.open || c.flag) continue;
      c.open = true;
      c.el.classList.add('open');
      const n = around(j).filter(k => cells[k].mine).length;
      c.el.textContent = n || '';
      c.el.style.color = ['', '#0000d6', '#007a00', '#d60000', '#00007a', '#7a0000'][n] || '#000';
      if (!n) stack.push(...around(j));
    }
    if (cells.filter(c => c.open).length === cells.length - MINES) finish(true);
  }

  function finish(won, hit) {
    over = true;
    clearInterval(timer);
    $('face').textContent = won ? '😎' : '😵';
    $('mineText').textContent = won ? '선물을 지켰다! 생일 축하해 🎁' : '펑! 얼굴을 눌러 다시 도전';
    if (won) { burst(); playSong(); return; }
    cells.forEach(c => { if (c.mine) c.el.textContent = '💣'; });
    cells[hit].el.classList.add('boom');
  }

  $('face').addEventListener('click', newGame);
  flagMode.addEventListener('click', () => {
    flagMode.setAttribute('aria-pressed', flagMode.getAttribute('aria-pressed') !== 'true');
  });
  newGame();

  // 행복 다운로드
  const bar = $('progress');
  for (let i = 0; i < 20; i++) bar.appendChild(document.createElement('i'));
  let percent, loader;
  function download() {
    clearInterval(loader);
    percent = 0;
    loader = setInterval(() => {
      percent = Math.min(100, percent + 5);
      [...bar.children].forEach((el, i) => el.classList.toggle('on', i < percent / 5));
      $('loadText').textContent = percent < 100 ? `행복 다운로드 중... ${percent}%` : '다운로드 완료! 행복 100% 💖';
      if (percent === 100) clearInterval(loader);
    }, 350);
  }
  $('reload').addEventListener('click', download);
  download();

  burst();
</script>
</body>
</html>
