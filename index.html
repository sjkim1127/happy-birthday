<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김성주, 생일 축하해! 🎂</title>
<meta name="description" content="김성주 만 22세 생일 파티 — 촛불을 끄고 소원을 빌어보세요">
<link rel="icon" type="image/svg+xml" href="assets/icons/gift_24_color.svg">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: DSEG7;
    src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');
  }
  :root {
    --ui: Tahoma, Gulim, '굴림', Dotum, '돋움', 'Nanum Gothic', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; font: 1rem var(--ui); color: #173252; background: #3f7fe0; }
  [hidden] { display: none !important; }

  /* 생일 케이크와 촛불 */
  .age { display: inline-block; font-weight: bold; }
  #message { line-height: 1.5; }
  .cake { position: relative; height: 220px; margin: 4px auto 0; }
  .layer { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 18px 18px 10px 10px; box-shadow: inset -22px 0 26px rgba(0, 0, 0, .18), inset 18px 0 20px rgba(255, 255, 255, .25); }
  .layer::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 28px; border-radius: 18px 18px 0 0;
    background:
      radial-gradient(circle at 15px 18px, var(--icing) 14px, transparent 15px) 0 0 / 30px 34px repeat-x,
      linear-gradient(var(--icing) 18px, transparent 18px);
  }
  .bottom { bottom: 14px; height: 82px; --icing: #fff1f6; }
  .top { bottom: 94px; height: 64px; --icing: #fff6cc; }
  .plate { position: absolute; bottom: 0; left: 0; width: 100%; height: 18px; border-radius: 50%; background: linear-gradient(#fff, #aeb6c8); box-shadow: 0 3px 5px rgba(0, 0, 0, .25); }
  .candles { position: absolute; bottom: 156px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
  .candle { position: relative; width: 28px; height: 66px; border: 0; background: none; cursor: pointer; }
  .candle::after { content: ''; position: absolute; bottom: 0; left: 9px; width: 10px; height: 42px; border-radius: 3px; background: repeating-linear-gradient(45deg, #fff 0 5px, var(--c) 5px 10px); }
  .flame {
    position: absolute; bottom: 43px; left: 7px; width: 14px; height: 21px; border-radius: 50% / 65% 65% 35% 35%;
    background: radial-gradient(circle at 50% 70%, #fff7b0, #ffb02e 55%, #ff5a36); box-shadow: 0 0 14px 5px rgba(255, 170, 50, .6);
    transform-origin: bottom center; animation: flicker .35s ease-in-out infinite alternate;
  }
  @keyframes flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.1, .92) rotate(3deg); } }
  .candle.out .flame { opacity: 0; box-shadow: none; }

  /* 타이머, 지뢰찾기의 빨간 숫자 */
  .led { background: #000; color: #ff2b1c; font-family: DSEG7, monospace; font-weight: normal; text-shadow: 0 0 6px rgba(255, 43, 28, .7); }
  #countdown { display: block; margin-top: 10px; }

  /* 오류 창 */
  .alert { display: flex; align-items: center; gap: 12px; text-align: left; line-height: 1.6; }

  /* 지뢰찾기 */
  .mine-top { display: flex; align-items: center; justify-content: space-between; padding: 6px; margin-bottom: 10px; border: 2px solid; }
  .mine-top .led { padding: 5px 6px; font-size: 20px; }
  #face { min-width: 0; width: 38px; height: 38px; padding: 0; font-size: 20px; }
  .board { display: grid; justify-content: center; }
  .cell {
    font: bold 15px var(--ui); cursor: pointer;
    border: 3px solid; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .cell:active { border-width: 1px; }
  .cell.open { border-width: 1px; cursor: default; }
  #flagMode[aria-pressed="true"] { background: #c9ddff; box-shadow: inset 1px 1px 3px rgba(0, 0, 0, .35); }
  #mineText { margin-top: 8px; }

  /* 로딩 */
  .progress { display: flex; gap: 2px; height: 22px; margin: 12px 0; padding: 3px; border-radius: 5px; }
  .progress i { flex: 1; }

  /* 설문 */
  #pollResult:not(:empty) { margin-top: 14px; font: 800 28px var(--ui); color: #e0197d; }
  #scare { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; border: 0; background: #000; }
  #scare::backdrop { background: #000; }
  #chase { width: 100%; height: 100%; display: block; }
  #scareClose { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; font-size: 22px; }
  #scareEnd { position: absolute; inset: auto 0 12%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #scareEnd p { font: 800 32px var(--ui); color: #ff2b1c; }
  #scareEnd .buttons { margin-top: 0; }

</style>
<link rel="stylesheet" href="desktop.css?v=2">

<body>

  <source media="(max-width: 650px)" srcset="assets/bliss-small.webp">

    <div class="desktop-brand">

  </header>
  <div class="col party-column">
    <section class="window" id="party">
      <div class="titlebar">
        <img class="icon app-icon" src="assets/icons/gift_24_color.svg" alt="" draggable="false">

        <button class="ctl minimize" aria-label="창 최소화"><img class="icon" src="assets/icons/subtract_16_regular.svg" alt="" draggable="false"></button>

        <button class="ctl close" aria-label="창 닫기"><img class="icon" src="assets/icons/dismiss_16_regular.svg" alt="" draggable="false"></button>

        <div class="buttons"><button class="btn" id="agree">인정</button></div>
      </div>

    <section class="window" id="pollWin">
      <div class="titlebar">

        <h2 tabindex="-1" data-shortcut="설문">설문조사.exe</h2>
        <button class="ctl minimize" aria-label="창 최소화"><img class="icon" src="assets/icons/subtract_16_regular.svg" alt="" draggable="false"></button>
        <button class="ctl close" aria-label="창 닫기"><img class="icon" src="assets/icons/dismiss_16_regular.svg" alt="" draggable="false"></button>
      </div>
      <div class="body">
        <p>Q. 만 22세 김성주는?</p>

          <button class="btn" id="old">늙었다</button>
          <button class="btn" id="young">젊다</button>

  <div class="col games-column">
    <section class="window" id="mineWin">
      <div class="titlebar">
        <img class="icon app-icon" src="assets/icons/games_24_regular.svg" alt="" draggable="false">
        <h2 tabindex="-1" data-shortcut="지뢰찾기">지뢰찾기</h2>
        <button class="ctl minimize" aria-label="창 최소화"><img class="icon" src="assets/icons/subtract_16_regular.svg" alt="" draggable="false"></button>
        <button class="ctl close" aria-label="창 닫기"><img class="icon" src="assets/icons/dismiss_16_regular.svg" alt="" draggable="false"></button>
      </div>
      <div class="body">
        <div class="mine-top"><span class="led" id="mineCount">008</span><button class="btn" id="face" aria-label="새 게임">🙂</button><span class="led" id="mineTime">000</span></div>
        <div class="board" id="board"></div>

<div class="lawn" aria-hidden="true">
  <img class="icon sticker sticker-globe" src="assets/icons/globe_24_color.svg" alt="" draggable="false">
  <img class="icon sticker sticker-folder" src="assets/icons/document_folder_24_color.svg" alt="" draggable="false">

<footer class="taskbar">
  <div class="task-inner">
    <button id="start" aria-expanded="false" aria-controls="startPanel"><img class="icon" src="assets/icons/apps_24_color.svg" alt="" draggable="false">시작</button>
    <nav class="task-apps" id="taskApps" aria-label="열린 창"></nav>
    <div class="tray">
      <time id="clock" title="한국 시간 (KST)"></time>
    </div>
  </div>
  <div id="startPanel" class="start-panel" hidden>
    <div class="start-heading"><img class="icon" src="assets/icons/gift_24_color.svg" alt="" draggable="false"><strong>생일 바탕화면</strong></div>
    <nav id="startApps" aria-label="모든 앱"></nav>
    <button id="restoreAll" class="btn">모든 창 다시 열기</button>

</footer>

  <button class="ctl" id="scareClose" aria-label="영상 닫기"><img class="icon" src="assets/icons/dismiss_16_regular.svg" alt=""></button>

    <p>늙었다고...?</p>
    <div class="buttons"><button class="btn" id="replay">다시 보기</button><button class="btn" id="sorry">잘못했어요</button></div>
  </div>
</dialog>

<script>
  const $ = id => document.getElementById(id);
  const colors = ['#ff4fa3', '#ffd400', '#00c96b', '#1ec8ff', '#9b5cff'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const message = $('message');
  const startText = message.textContent;

  // 타이머 (한국 시간): 11월 27일 0시에 생일 시작, 28일 0시에 끝
  const START = new Date('2026-11-27T00:00:00+09:00').getTime();
  const END = new Date('2026-11-28T00:00:00+09:00').getTime();
  const countdown = $('countdown');
  const timerLabel = $('timerLabel');
  let wasBefore = false;

  const clockFormat = new Intl.DateTimeFormat('ko-KR', {
    hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Seoul',
  });

  function tick(now = Date.now()) {
    $('clock').textContent = clockFormat.format(now);
    const before = now < START;
    // 페이지를 켜둔 채로 생일이 시작되면 폭죽
    if (wasBefore && !before && now < END) burst();
    wasBefore = before;

    const left = Math.max(0, Math.ceil(((before ? START : END) - now) / 1000));
    if (!left) {
      timerLabel.textContent = '2026년 생일은 여기까지!';
      countdown.textContent = '00:00:00';
      return;
    }
    timerLabel.textContent = before ? '생일 시작까지' : '🎉 생일 시작! 끝나기까지';
    const h = Math.floor(left / 3600);
    const m = Math.floor(left / 60) % 60;
    const s = left % 60;
    countdown.textContent = [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  }

  // 창과 스티커 끌어서 옮기기
  const desktopLayout = matchMedia('(min-width: 1000px)');
  const start = $('start');
  const startPanel = $('startPanel');
  const windows = [...document.querySelectorAll('.window')];
  const shortcuts = new Map();
  let frontWindow = null;

  function bringForward(win) {
    if (frontWindow) {
      frontWindow.classList.remove('foreground');
      shortcuts.get(frontWindow).classList.remove('current');
    }
    frontWindow = win;
    if (win) {
      win.classList.add('foreground');
      shortcuts.get(win).classList.add('current');
    }
  }

  function draggable(handle, target, isWindow = false) {
    let x = 0, y = 0, drag;
    handle.addEventListener('pointerdown', event => {
      if (event.button || drag || event.target.closest('button')) return;
      if (isWindow && !desktopLayout.matches) return;

      const rect = handle.getBoundingClientRect();
      drag = {
        id: event.pointerId, offsetX: event.clientX - x, offsetY: event.clientY - y,
        left: x - rect.left, top: y - rect.top, width: rect.width, height: rect.height,
      };
      handle.setPointerCapture(event.pointerId);
    });
    handle.addEventListener('pointermove', event => {
      if (drag?.id !== event.pointerId) return;
      const { left, top, width, height, offsetX, offsetY } = drag;
      const barTop = $('clock').getBoundingClientRect().top;
      x = Math.min(left + innerWidth - width, Math.max(left, event.clientX - offsetX));
      y = Math.min(top + barTop - height - 5, Math.max(top, event.clientY - offsetY));
      target.style.translate = `${x}px ${y}px`;
    });
    handle.addEventListener('lostpointercapture', () => { drag = null; });
    if (isWindow) {
      desktopLayout.addEventListener('change', () => {
        x = y = 0;
        drag = null;
        target.style.translate = '';
      });
    }
  }

  function openStart(open, returnFocus = false) {
    startPanel.hidden = !open;
    start.setAttribute('aria-expanded', open);
    if (open) $('startApps').firstElementChild.focus();
    if (returnFocus) start.focus();
  }

  for (const win of windows) {
    const titlebar = win.querySelector('.titlebar');
    const title = titlebar.querySelector('h2');
    win.setAttribute('aria-labelledby', `${win.id}Title`);
    title.id = `${win.id}Title`;

    const menuButton = document.createElement('button');
    menuButton.type = 'button';
    menuButton.className = 'app-shortcut';
    menuButton.setAttribute('aria-controls', win.id);
    menuButton.append(titlebar.querySelector('.app-icon').cloneNode(), title.dataset.shortcut);
    $('startApps').append(menuButton);

    const taskButton = menuButton.cloneNode(true);
    taskButton.classList.add('task-app');
    taskButton.setAttribute('aria-label', title.dataset.shortcut);
    taskButton.setAttribute('aria-pressed', 'true');
    const label = document.createElement('span');
    label.textContent = taskButton.lastChild.textContent;
    taskButton.lastChild.replaceWith(label);
    taskButton.title = title.dataset.shortcut;
    $('taskApps').append(taskButton);
    shortcuts.set(win, taskButton);

    function showWindow() {
      win.hidden = false;
      taskButton.setAttribute('aria-pressed', 'true');
      bringForward(win);
      title.focus({ preventScroll: true });
      win.scrollIntoView({ block: 'nearest' });
    }

    function hideWindow() {
      win.hidden = true;
      taskButton.setAttribute('aria-pressed', 'false');
      if (frontWindow === win) bringForward(null);
      taskButton.focus();
    }

    menuButton.addEventListener('click', () => {
      openStart(false);
      showWindow();
    });
    taskButton.addEventListener('click', () => {
      if (!win.hidden && frontWindow === win) hideWindow();
      else showWindow();
    });
    win.querySelectorAll('.minimize, .close').forEach(button => button.addEventListener('click', hideWindow));
    win.addEventListener('pointerdown', () => bringForward(win));
    win.addEventListener('focusin', () => bringForward(win));
    draggable(titlebar, win, true);
  }
  bringForward($('party'));
  document.querySelectorAll('.sticker').forEach(sticker => draggable(sticker, sticker));

  start.addEventListener('click', () => openStart(startPanel.hidden));
  document.addEventListener('pointerdown', event => {
    if (!start.contains(event.target) && !startPanel.contains(event.target)) openStart(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !startPanel.hidden) openStart(false, true);
  });
  $('restoreAll').addEventListener('click', () => {
    for (const [win, shortcut] of shortcuts) {
      win.hidden = false;
      shortcut.setAttribute('aria-pressed', 'true');
    }
    openStart(false, true);
    const rect = start.getBoundingClientRect();
    burst(rect.right, rect.top, 80);
  });

  // 색종이
  const canvas = $('confetti');
  const ctx = canvas.getContext('2d');
  let pieces = [];
  let running = false;

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize);
  resize();

  function burst(x = innerWidth / 2, y = innerHeight / 3, count = 150) {
    if (reduced) return;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 9;
      pieces.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: Math.random() < .5 ? 6 : 10,
        color: colors[i % colors.length],
      });
    }
    if (!running) { running = true; requestAnimationFrame(draw); }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.vx *= .98;
      p.vy = p.vy * .98 + .22;
      p.x += p.vx;
      p.y += p.vy;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size * .6);
    }
    pieces = pieces.filter(p => p.y < canvas.height + 20);
    running = pieces.length > 0;
    if (running) requestAnimationFrame(draw);
  }

  // 촛불
  const box = $('candles');
  colors.forEach((color, i) => {
    const candle = document.createElement('button');
    candle.className = 'candle';
    candle.style.setProperty('--c', color);
    candle.setAttribute('aria-label', `${i + 1}번 촛불 끄기`);
    candle.innerHTML = '<span class="flame"></span>';
    candle.addEventListener('click', () => {
      if (candle.classList.contains('out')) return;
      candle.classList.add('out');
      candle.setAttribute('aria-disabled', 'true');
      const left = box.querySelectorAll('.candle:not(.out)').length;
      $('candleCount').textContent = `${colors.length - left} / ${colors.length}`;
      if (left) {
        message.textContent = `후~ 촛불이 ${left}개 남았어요`;
      } else {
        message.textContent = '소원이 꼭 이루어지길! 행복한 하루 보내 🥳';
        burst(innerWidth * .25, innerHeight * .35);
        burst(innerWidth * .75, innerHeight * .35);
        playSong();
      }
    });
    box.appendChild(candle);
  });

  $('relight').addEventListener('click', () => {
    box.querySelectorAll('.candle').forEach(candle => {
      candle.classList.remove('out');
      candle.removeAttribute('aria-disabled');
    });
    $('candleCount').textContent = `0 / ${colors.length}`;
    message.textContent = startText;
  });
  $('boom').addEventListener('click', () => burst());

  // 생일 축하 멜로디 (8비트 느낌)
  let audio;
  let playingUntil = 0;
  function playSong() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audio ??= new Ctx();
    audio.resume();
    if (audio.currentTime < playingUntil) return;
    const G = 392, A = 440, B = 493.9, C = 523.3, D = 587.3, E = 659.3, F = 698.5, G2 = 784;
    const notes = [
      [G,.75],[G,.25],[A,1],[G,1],[C,1],[B,2],
      [G,.75],[G,.25],[A,1],[G,1],[D,1],[C,2],
      [G,.75],[G,.25],[G2,1],[E,1],[C,1],[B,1],[A,2],
      [F,.75],[F,.25],[E,1],[C,1],[D,1],[C,2],
    ];
    const beat = .45;
    let t = audio.currentTime + .05;
    for (const [freq, length] of notes) {
      const dur = length * beat;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(.08, t + .02);
      gain.gain.exponentialRampToValueAtTime(.001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur);
      t += dur;
    }
    playingUntil = t;
  }
  $('song').addEventListener('click', playSong);

  // 오류 창
  $('agree').addEventListener('click', () => {
    $('errorText').innerHTML = '확인 완료.<br>당신은 만 22세입니다.<br>반박은 받지 않습니다.';
    burst(innerWidth / 2, innerHeight / 2, 60);
  });

  // 설문에서 '늙었다'를 선택하면 토끼 추격 영상 재생
  const scare = $('scare');
  const scareEnd = $('scareEnd');
  const pollResult = $('pollResult');
  const film = $('chase');
  const fx = film.getContext('2d');
  const LUNGE = 4.8, CUT = 5.8;
  const rabbit = new Image();
  rabbit.src = 'assets/chase-rabbit.webp';
  const rabbitReady = rabbit.decode().then(() => true, () => false);
  let raf, sound, chaseRun = 0;

  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp = k => Math.min(1, Math.max(0, k));

  function oval(x, y, rx, ry, fill, rot = 0) {
    fx.beginPath();
    fx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    fx.fillStyle = fill;
    fx.fill();
  }

  function render(t) {
    const w = film.width, h = film.height, u = Math.min(w, h);
    fx.fillStyle = '#000';
    fx.fillRect(0, 0, w, h);
    if (t >= CUT) return;

    const run = clamp((t - .9) / (LUNGE - .9));
    const lunge = clamp((t - LUNGE) / .25);
    const shake = reduced ? 0 : u * (.004 + run * .009 + lunge * .023);
    fx.save();
    fx.translate((Math.random() - .5) * shake, Math.sin(t * 13) * shake);

    // 어두운 복도: 문틀이 멀어짐 (뒷걸음질하는 카메라)
    const cx = w / 2, cy = h * .51;
    const corridor = fx.createRadialGradient(cx, cy, 0, cx, cy, u * .77);
    corridor.addColorStop(0, '#392921');
    corridor.addColorStop(.45, '#231610');
    corridor.addColorStop(1, '#100c0c');
    fx.fillStyle = corridor;
    fx.fillRect(0, 0, w, h);
    for (let i = 0; i < 7; i++) {
      const depth = (i + (t * 1.4) % 1) / 7;
      const size = Math.pow(1 - depth, 2);
      const rw = w * 1.3 * size + u * .08, rh = h * 1.3 * size + u * .1;
      fx.strokeStyle = `rgba(120, 70, 70, ${.1 + size * .3})`;
      fx.lineWidth = u * (.004 + size * .02);
      fx.strokeRect(cx - rw / 2, cy - rh / 2, rw, rh);
    }
    fx.strokeStyle = 'rgba(120, 70, 70, .25)';
    fx.lineWidth = u * .005;
    for (const [x, y] of [[0, 0], [w, 0], [0, h], [w, h]]) {
      fx.beginPath();
      fx.moveTo(x, y);
      fx.lineTo(cx, cy);
      fx.stroke();
    }

    const step = t * (10 + run * 4);
    const stride = Math.sin(step);
    const rabbitHeight = u * (lerp(.20, .98, run ** 1.8) + lunge * 1.28);
    const rabbitWidth = rabbitHeight * rabbit.naturalWidth / rabbit.naturalHeight;
    const x = cx + stride * u * .055 * (1 - lunge);
    const ground = cy + u * lerp(.14, .46, run);
    const y = ground - Math.abs(stride) * u * lerp(.012, .048, run) + lunge * u * .56;
    oval(x, ground, rabbitWidth * .36, rabbitWidth * .09, 'rgba(0, 0, 0, .65)');

    fx.save();
    fx.translate(x, y);
    fx.rotate(stride * .105 * (1 - lunge));
    fx.scale(Math.cos(step) < 0 ? -1 : 1, 1);
    fx.drawImage(rabbit, -rabbitWidth / 2, -rabbitHeight, rabbitWidth, rabbitHeight);
    fx.restore();
    fx.restore();

    // 손전등, 노이즈, 주사선
    const light = fx.createRadialGradient(cx, cy, u * .12, cx, cy, u * .78);
    light.addColorStop(0, 'rgba(0, 0, 0, .05)');
    light.addColorStop(.6, 'rgba(0, 0, 0, .40)');
    light.addColorStop(1, 'rgba(0, 0, 0, .96)');
    fx.fillStyle = light;
    fx.fillRect(0, 0, w, h);
    for (let i = 0; i < 350; i++) {
      fx.fillStyle = `rgba(255, 255, 255, ${Math.random() * .14})`;
      fx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    fx.fillStyle = 'rgba(0, 0, 0, .22)';
    for (let line = 0; line < h; line += 4) fx.fillRect(0, line, w, 1);

    fx.font = `${Math.round(u * .045)}px Tahoma, monospace`;
    fx.fillStyle = '#fff';
    fx.fillText(`11.27  00:00:0${Math.floor(t)}`, u * .05, h - u * .05);
    fx.fillText('REC', u * .1, u * .085);
    if (reduced || t % 1 < .6) oval(u * .065, u * .07, u * .016, u * .016, '#ff2b1c');
  }

  // 발소리와 마지막 효과음
  function chaseSound() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audio ??= new Ctx();
    audio.resume();
    sound = audio.createGain();
    sound.connect(audio.destination);
    const now = audio.currentTime;
    const note = (type, from, to, at, dur, volume) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, now + at);
      osc.frequency.exponentialRampToValueAtTime(to, now + at + dur);
      gain.gain.setValueAtTime(volume, now + at);
      gain.gain.exponentialRampToValueAtTime(.001, now + at + dur);
      osc.connect(gain).connect(sound);
      osc.start(now + at);
      osc.stop(now + at + dur);
    };
    for (let at = .9, gap = .36; at < LUNGE; at += gap, gap = Math.max(.15, gap * .92)) {
      note('sine', 130, 45, at, .13, .1 + at * .05);
    }
    for (const f of [620, 660, 935]) note('sawtooth', f, f * 1.5, LUNGE, .9, .07);
  }

  function showEnd() {
    render(CUT);
    scareEnd.hidden = false;
    $('sorry').focus();
  }

  async function play() {
    stopChase();
    const run = chaseRun;
    scareEnd.hidden = true;
    $('scareClose').focus();
    const ready = await rabbitReady;
    if (run !== chaseRun) return;
    if (!ready) {
      showEnd();
      scareEnd.querySelector('p').textContent = '영상을 불러올 수 없어요.';
      return;
    }
    scareEnd.querySelector('p').textContent = '늙었다고...?';
    const k = Math.min(1, 1100 / Math.max(innerWidth, innerHeight));
    film.width = Math.round(innerWidth * k);
    film.height = Math.round(innerHeight * k);
    // 동작 줄이기 설정이면 정지 화면만 보여줌
    if (reduced) {
      render(3.8);
      scareEnd.hidden = false;
      $('sorry').focus();
      return;
    }
    chaseSound();
    const startedAt = performance.now();
    const frame = now => {
      const t = Math.max(0, (now - startedAt) / 1000);
      if (t >= CUT) return showEnd();
      render(t);
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  function stopChase() {
    chaseRun++;
    cancelAnimationFrame(raf);
    sound?.disconnect();
    sound = null;
  }

  $('old').addEventListener('click', () => {
    pollResult.textContent = '';
    pieces = [];
    scare.showModal();
    play();
  });
  function closeScare() {
    if (!scare.open) return;
    stopChase();
    scare.close();
    $('old').focus();
  }
  $('sorry').addEventListener('click', closeScare);
  $('scareClose').addEventListener('click', closeScare);
  $('replay').addEventListener('click', play);
  scare.addEventListener('cancel', event => {
    event.preventDefault();
    closeScare();
  });
  $('young').addEventListener('click', e => {
    pollResult.textContent = '사랑해 💖';
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 120);
  });

  // 지뢰찾기 (8×8, 지뢰 8개)
  const SIZE = 8, MINES = 8;
  const board = $('board');
  const flagMode = $('flagMode');
  let cells, started, over, seconds, timer;

  const around = i => {
    const x = i % SIZE, y = Math.floor(i / SIZE), list = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const a = x + dx, b = y + dy;
        if ((dx || dy) && a >= 0 && a < SIZE && b >= 0 && b < SIZE) list.push(b * SIZE + a);
      }
    }
    return list;
  };
  const pad = n => String(n).padStart(3, '0');

  function newGame() {
    clearInterval(timer);
    started = over = false;
    seconds = 0;
    $('mineTime').textContent = pad(0);
    $('mineCount').textContent = pad(MINES);
    $('face').textContent = '🙂';
    $('mineText').textContent = '지뢰를 피해서 선물을 지켜라!';
    board.innerHTML = '';
    cells = Array.from({ length: SIZE * SIZE }, (_, i) => {
      const el = document.createElement('button');
      el.className = 'cell';
      el.setAttribute('aria-label', `${Math.floor(i / SIZE) + 1}행 ${i % SIZE + 1}열`);
      el.addEventListener('click', () => flagMode.getAttribute('aria-pressed') === 'true' ? flag(i) : open(i));
      el.addEventListener('contextmenu', e => { e.preventDefault(); flag(i); });
      board.appendChild(el);
      return { el, mine: false, open: false, flag: false };
    });
  }

  function flag(i) {
    const c = cells[i];
    if (over || c.open) return;
    c.flag = !c.flag;
    c.el.textContent = c.flag ? '🚩' : '';
    $('mineCount').textContent = pad(Math.max(0, MINES - cells.filter(c => c.flag).length));
  }

  // 첫 칸과 그 주변에는 지뢰를 두지 않음
  function plant(first) {
    const safe = new Set([first, ...around(first)]);
    let placed = 0;
    while (placed < MINES) {
      const i = Math.floor(Math.random() * cells.length);
      if (!safe.has(i) && !cells[i].mine) { cells[i].mine = true; placed++; }
    }
    started = true;
    timer = setInterval(() => { $('mineTime').textContent = pad(Math.min(999, ++seconds)); }, 1000);
  }

  function open(i) {
    if (over || cells[i].open || cells[i].flag) return;
    if (!started) plant(i);
    if (cells[i].mine) return finish(false, i);
    const stack = [i];
    while (stack.length) {
      const j = stack.pop(), c = cells[j];
      if (c.open || c.flag) continue;
      c.open = true;
      c.el.classList.add('open');
      const n = around(j).filter(k => cells[k].mine).length;
      c.el.textContent = n || '';
      c.el.style.color = ['', '#0000d6', '#007a00', '#d60000', '#00007a', '#7a0000'][n] || '#000';
      if (!n) stack.push(...around(j));
    }
    if (cells.filter(c => c.open).length === cells.length - MINES) finish(true);
  }

  function finish(won, hit) {
    over = true;
    clearInterval(timer);
    $('face').textContent = won ? '😎' : '😵';
    $('mineText').textContent = won ? '선물을 지켰다! 생일 축하해 🎁' : '펑! 얼굴을 눌러 다시 도전';
    if (won) { burst(); playSong(); return; }
    cells.forEach(c => { if (c.mine) c.el.textContent = '💣'; });
    cells[hit].el.classList.add('boom');
  }

  $('face').addEventListener('click', newGame);
  flagMode.addEventListener('click', () => {
    flagMode.setAttribute('aria-pressed', flagMode.getAttribute('aria-pressed') !== 'true');
  });
  newGame();

  // 행복 다운로드
  const bar = $('progress');
  for (let i = 0; i < 20; i++) bar.appendChild(document.createElement('i'));
  let percent, loader;
  function download() {
    clearInterval(loader);
    percent = 0;
    renderDownload();
    loader = setInterval(() => {
      percent += 5;
      renderDownload();
      if (percent === 100) clearInterval(loader);
    }, 350);
  }

  function renderDownload() {
    bar.setAttribute('aria-valuenow', percent);
    [...bar.children].forEach((el, i) => el.classList.toggle('on', i < percent / 5));
    $('loadText').textContent = percent < 100 ? `행복 다운로드 중... ${percent}%` : '다운로드 완료! 행복 100% 💖';
  }
  $('reload').addEventListener('click', download);
  download();
  tick();
  setInterval(tick, 250);
  burst();
</script>
</body>
</html>
